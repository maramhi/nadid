<style>
:root { padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); }
body { margin:0; }
img { max-width:100%; }
[hidden] { display:none !important; }

<style>
/* Single light (white) theme by request. Layout: planning-board tool — header + tabs; page 1 = trainer cards over a sticky course tray; page 2 = days-as-rows timetable (time flows right→left) with a side panel */
:root, .force-light { color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F0F3F2; --ink:#16201E; --muted:#5A6965; --line:#D2DAD7;
  --accent:#145C50; --accent-ink:#FFFFFF; --accent-soft:#D6EBE5;
  --ok:#2C7A4B; --warn:#A86300; --bad:#B4232C; --bad-soft:#FBE3E4;
  --chip-s:60%; --chip-l:91%; --chip-fg-l:22%; --chip-edge-l:72%;
  --font-display:"Noto Kufi Arabic", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --font-body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --r:8px;
}
body { background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.55; }
.app { padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:16px 0; max-width:1500px; margin-inline:auto; }
h1,h2,h3 { font-family:var(--font-display); margin:0; text-wrap:balance; font-weight:700; }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.num { font-variant-numeric:tabular-nums; }

/* header */
.top { display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; padding-bottom:14px; border-bottom:1px solid var(--line); }
.org-logo { height:52px; width:auto; background:transparent; }
@media (max-width:520px) { .org-logo { height:40px; } }
.brand { display:flex; align-items:center; gap:10px; }
.brand-mark { width:34px; height:34px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; }
.brand h1 { font-size:18px; letter-spacing:0; }
.brand small { display:block; color:var(--muted); font-size:12px; margin-top:-2px; }
.meta { display:flex; flex-wrap:wrap; gap:8px; color:var(--muted); font-size:13px; }
.pill { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:3px 10px; white-space:nowrap; }
.pill.demo { border-color:var(--warn); color:var(--warn); }
.spacer { flex:1; }
.tabs { display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px; }
.tab { border:0; background:transparent; padding:7px 16px; border-radius:7px; font-weight:600; color:var(--muted); display:flex; gap:8px; align-items:center; }
.tab[aria-selected="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgb(0 0 0 / .08); }
.tab .step { font-size:11px; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; background:var(--line); color:var(--ink); }
.tab[aria-selected="true"] .step { background:var(--accent); color:var(--accent-ink); }
.btn { border:1px solid var(--line); background:var(--surface); padding:7px 14px; border-radius:var(--r); font-weight:500; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
.btn:hover { border-color:var(--muted); }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.ghost { border-color:var(--line); background:var(--bg); color:var(--ink); }
.btn svg { width:16px; height:16px; flex:none; }

/* summary strip */
.summary { display:flex; flex-wrap:wrap; gap:8px 28px; padding:14px 0; align-items:baseline; }
.stat { display:flex; gap:8px; align-items:baseline; }
.stat b { font-size:20px; font-family:var(--font-display); font-variant-numeric:tabular-nums; }
.stat span { color:var(--muted); font-size:13px; }
.stat.bad b { color:var(--bad); }
/* instructions on the right, figures on the left */
.summary > .hint { order:-2; max-width:60ch; }
.summary > .spacer { order:-1; }
.summary > .stat.gsnote { flex-basis:100%; justify-content:flex-end; }
.hint { color:var(--muted); font-size:13px; }

/* ---------- assignment page ---------- */
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:12px; padding-bottom:20px; }
.tcard { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; min-height:190px; transition:border-color .15s, background .15s; }
.tcard.over-drop { border-color:var(--accent); background:var(--accent-soft); }
.tcard-head { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
.tname { font-weight:700; font-size:15px; }
.load { font-size:13px; color:var(--muted); }
.load b { color:var(--ink); font-size:15px; }
.load.full b { color:var(--ok); } .load.over b { color:var(--bad); }
.bar { height:6px; border-radius:3px; background:var(--surface-2); overflow:hidden; }
.bar i { display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .25s; }
.bar.full i { background:var(--ok); } .bar.over i { background:var(--bad); }
.labrow { display:grid; grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:6px 8px; font-size:13px; color:var(--muted); min-width:0; }
.labrow select.roomtype { padding:3px 4px; border:1px solid var(--line); border-radius:6px; background:var(--bg); font:inherit; font-size:13px; color:var(--ink); }
.roompop { position:fixed; z-index:1000; overflow-y:auto; background:var(--bg, #fff); border:1px solid var(--line, #ccd); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.18); padding:4px; direction:rtl; }
.roompop button { display:flex; justify-content:space-between; align-items:center; width:100%; padding:6px 10px; border:0; border-radius:6px; background:none; font:inherit; font-size:13px; color:var(--ink, #222); cursor:pointer; }
.roompop button:hover { background:rgba(90,175,214,.15); }
.roompop button span { color:var(--muted, #778); font-size:12px; }
.roompop button.off b { color:var(--muted, #778); font-weight:500; }
.roompop .rp-h { padding:6px 10px 2px; font-size:12px; color:var(--muted, #778); border-top:1px solid var(--line, #ccd); margin-top:4px; }
.roompop .rp-h:first-child { border-top:0; margin-top:0; }
.labrow input { width:100%; min-width:0; box-sizing:border-box; padding:3px 6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); text-align:center; }
.drop-list { display:flex; flex-wrap:wrap; gap:6px; flex:1; align-content:flex-start; border-radius:8px; }
.drop-empty { box-sizing:border-box; color:var(--muted); font-size:12px; border:1px dashed var(--line); border-radius:8px; padding:14px; text-align:center; width:100%; }

.chip { --h:200; background:hsl(var(--h) var(--chip-s) var(--chip-l)); color:hsl(var(--h) 45% var(--chip-fg-l)); border:1px solid hsl(var(--h) 50% var(--chip-edge-l)); border-radius:7px; padding:4px 6px 4px 9px; font-size:12.5px; display:inline-flex; align-items:center; gap:6px; touch-action:none; cursor:grab; user-select:none; }
.chip .x { border:0; background:transparent; padding:0 3px; opacity:.6; font-size:15px; line-height:1; }
.chip .x:hover { opacity:1; }
.chip .g { opacity:.75; }
.chip .rmt { display:inline-flex; align-items:center; gap:4px; border:0; background:transparent; color:inherit; opacity:.6; font-size:10.5px; padding:0 2px; line-height:1.6; }
.chip .rmt i { width:18px; height:10px; border-radius:5px; border:1px solid currentColor; position:relative; flex:none; }
.chip .rmt i::after { content:""; position:absolute; top:1px; inset-inline-start:1px; width:6px; height:6px; border-radius:50%; background:currentColor; transition:inset-inline-start .15s; }
.chip .rmt:hover { opacity:1; }
.chip .rmt[aria-checked="true"] { opacity:1; font-weight:700; }
.chip .rmt[aria-checked="true"] i { background:currentColor; }
.chip .rmt[aria-checked="true"] i::after { inset-inline-start:9px; background:hsl(var(--h) var(--chip-s) var(--chip-l)); }
.chip .sws { display:inline-flex; flex-direction:column; align-items:flex-start; gap:1px; }
.chip .rmt, .chip > b, .chip .g { white-space:nowrap; }
.rmt-hint { margin:-4px 0 0; font-size:11px; color:var(--muted); }

.pickpanel { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:0 0 14px; display:flex; flex-direction:column; gap:10px; }

    (byT[tid] ??= {}); (byT[tid][s.day] ??= []); i.gks.forEach(g => { (byG[g] ??= {}); (byG[g][s.day] ??= []); });
    for (let k = s.start; k < s.start + s.len; k++) { byT[tid][s.day].push(k); i.gks.forEach(g => byG[g][s.day].push(k)); hours++; if (k < noon) morning++; dayLoad[s.day]++; }
  });
  delete byT['-'];
  let days = 0, gaps = 0, maxDay = 0; const tids = Object.keys(byT);
  tids.forEach(t => Object.values(byT[t]).forEach(ks => { days++; maxDay = Math.max(maxDay, ks.length); }));
  Object.values(byG).forEach(g => Object.values(g).forEach(ks => { gaps += (Math.max(...ks) - Math.min(...ks) + 1) - new Set(ks).size; }));
  const mean = dayLoad.reduce((a,b) => a+b, 0) / 5;
  const sd = Math.sqrt(dayLoad.reduce((a,b) => a + (b-mean)**2, 0) / 5);
  const gOff = Object.values(byG).filter(g => Object.keys(g).length < 5).length, gAll = Object.keys(byG).length;
  const tOff = Object.values(byT).filter(t => Object.keys(t).length < 5).length;
  return { placed:placed.length, total:sol.length, gOff, gAll, tOff, tAll:tids.length, avgDays: tids.length ? days / tids.length : 0, gaps, maxDay, morning: hours ? Math.round(morning * 100 / hours) : 0, sd, dayLoad };
}

// keepPlaced: lectures already in the timetable stay where they are; only the unscheduled ones are placed around them
function generate(strategy, attempts = 36, keepPlaced = false) {
  const tp = tpl(), n = tp.n, br = new Set(tp.breaks);
  // المدمج: blended theory goes at 4:00 or later; the day may run past the template (up to 11 periods) for it
  const selfMax = Math.max(0, ...S.sessions.filter(x => isBlendTh(x)).map(x => x.len));
  const ST = STRATS[strategy] || STRATS.balanced, base = ST.base;
  const MO = ST.mo ?? base === 'morning', TC = ST.tc ?? base === 'trainees', BAL = !MO && !TC;
  const nSelf = ST.bl ? Math.max(n, Math.min(11, SELF_FROM + selfMax)) : n;
  const infos = {}; S.sessions.forEach(s => { infos[s.id] = info(s); });
  const foreign = foreignSessions().map(s => ({ s, i:info(s) }));
  const fixed = s => s.locked || (keepPlaced && s.day != null);
  const loads = {}; S.trainers.forEach(t => { loads[t.id] = trainerLoad(t); });
  let best = null;
  for (let a = 0; a < attempts; a++) {
    const rng = mulberry32(a * 7919 + strategy.length * 101 + 17);
    const sol = S.sessions.map(s => (fixed(s) && s.day != null) ? { ...s } : (fixed(s) ? { ...s, _skip:true } : { ...s, day:null, start:null }));
    const occ = new Set(), tDays = {}, dayLoad = [0,0,0,0,0], tDayLoad = {}, secDays = {};
    const keys = i => [i.tkey && 't'+i.tkey, i.rkey && 'r'+i.rkey, ...i.gks.map(g => 'g'+g)].filter(Boolean);
    const mark = (i, len, d, st) => { const tid = i.tkey || '-'; keys(i).forEach(k => { for (let t = st; t < st + len; t++) occ.add(k+'|'+d+'|'+t); }); (tDays[tid] ??= new Set()).add(d); tDayLoad[tid+'|'+d] = (tDayLoad[tid+'|'+d] || 0) + len; };
    foreign.forEach(({ s, i }) => mark(i, s.len, s.day, s.start));
    const place = (s, d, st) => {
      s.day = d; s.start = st; const i = infos[s.id], tid = i.tkey || '-';
      keys(i).forEach(k => { for (let t = st; t < st + s.len; t++) occ.add(k+'|'+d+'|'+t); });
      (tDays[tid] ??= new Set()).add(d); dayLoad[d] += s.len; tDayLoad[tid+'|'+d] = (tDayLoad[tid+'|'+d] || 0) + s.len;
      (secDays[s.sectionId] ??= new Set()).add(d);
    };
    sol.filter(s => s.day != null).forEach(s => place(s, s.day, s.start));
    const todo = sol.filter(s => s.day == null && !s._skip).map(s => ({ s, r:rng() }))
      .sort((x,y) => (y.s.len - x.s.len) || ((loads[infos[y.s.id].t?.id] || 0) - (loads[infos[x.s.id].t?.id] || 0)) * (0.6 + x.r * 0.4) || x.r - y.r)
      .map(o => o.s);
    for (const s of todo) {
      const i = infos[s.id], ks = keys(i), tid = i.tkey || '-';
      let bc = null, bs = Infinity;
      for (let d = 0; d < 5; d++) {
        if (ST.lv && levelOffDay(gkParts(i.gk).L) === d) continue;
        if (ST.tr && i.tkey && trainerOffDay(i.tkey) === d) continue;
        let gmin = Infinity, gmax = -Infinity; const gk = 'g' + i.gk;
        for (let t = 0; t < n; t++) if (occ.has(gk+'|'+d+'|'+t)) { gmin = Math.min(gmin, t); gmax = Math.max(gmax, t); }
        const tLoad = tDayLoad[tid+'|'+d] || 0;
        const selfLate = ST.bl && isBlendTh(s, i.sec);
        for (let st = selfLate ? SELF_FROM : 0; st + s.len <= (selfLate ? nSelf : n); st++) {
          let ok = true;
          for (let t = st; t < st + s.len && ok; t++) { if (br.has(t)) ok = false; else for (const k of ks) if (occ.has(k+'|'+d+'|'+t)) { ok = false; break; } }
          if (!ok) continue;
          const end = st + s.len - 1;
          const ggap = gmin === Infinity ? 0 : (st > gmax ? st - gmax - 1 : (end < gmin ? gmin - end - 1 : 0));
          // every strategy spreads each trainer across Sun–Thu: heavy days cost, a 7th+ hour in one day costs a lot
          let sc = rng() * 3 + (secDays[s.sectionId]?.has(d) ? 500 : 0) + tLoad * 7 + (tLoad + s.len > 6 ? 60 : 0);
          if (selfLate) sc = rng() * 3 + (secDays[s.sectionId]?.has(d) ? 500 : 0) + dayLoad[d] * 1.6 + (st - SELF_FROM) * 4;
          else {
            if (BAL) sc += dayLoad[d] * 1.6 + ggap * 2 + Math.abs(st - n * 0.3) * 0.5;
            if (TC) sc += ggap * 9 + (gmin === Infinity ? 0 : -4) + st * 0.6;
            if (MO) sc += (st + s.len) * 6 + ggap * 2;
          }
          if (sc < bs) { bs = sc; bc = [d, st]; }
        }
      }
      if (bc) place(s, bc[0], bc[1]);
    }
    const m = metrics(sol.filter(x => !x._skip));
    const obj = (m.total - m.placed) * 1000 + m.maxDay * 15 - m.avgDays * 20 + (BAL ? m.sd * 12 + m.gaps * 3 : 0) + (TC ? m.gaps * 12 : 0) + (MO ? (100 - m.morning) * 2 + m.gaps * 3 : 0);
    if (!best || obj < best.obj) best = { obj, sol, m };
  }
  return best;
}

function makeOptions() {

}
function applyOption(key) {
  const o = S.options.find(x => x.key === key); if (!o) return;

}

const specOfTrainer = t => String(t.id).split('-')[0];
function trainerCard(t, linked) {
  const load = trainerLoad(t), secs = S.sections.filter(s => s.trainerId === t.id), o = otherLoad(t), tot = load + o.h;
  const st = !t.quota ? '' : tot > t.quota ? 'over' : tot === t.quota ? 'full' : '';
  const msg = !t.quota ? '' : st === 'over' ? `تزيد ${tot - t.quota}` : st === 'full' ? 'مكتمل' : `متبقي ${t.quota - tot}`;
  const from = linked ? `تخصص ${SPECS[specOfTrainer(t)]}` : t.dept;
  return `<article class="tcard ${t.external || linked ? 'ext' : ''}" data-drop="trainer" data-id="${t.id}">
      <div class="tcard-head"><div><div class="tname">أ. ${esc(t.name)}</div>${t.external || linked ? `<span class="dept">من ${/^تخصص/.test(from) ? '' : 'قسم '}${esc(from)}</span>` : ''}</div>
        ${t.external ? `<button class="x rm" data-rmtr="${t.id}" aria-label="إزالة المدربة" title="إزالة من قائمة هذا الترم">×</button>` : ''}</div>
      <div class="hrs num">
        <div class="hbox ${st}"><span>ساعات الاتصال</span><b>${tot}${t.quota ? `<small> / ${t.quota}</small>` : ''}</b><em>${t.quota ? msg : (linked ? 'في هذا التخصص' : 'في قسمنا')}${o.h ? ` · منها ${o.h} في ${esc(o.where.join('، '))}` : ''}</em></div>
        <div class="hbox"><span>الساعات المعتمدة</span><b>${trainerCredit(t)}</b><em>وحدة${o.h ? ' هنا' : ''}</em></div>
      </div>
      ${t.quota ? `<div class="bar ${st}"><i style="width:${Math.min(100, tot * 100 / t.quota)}%"></i></div>` : ''}
      ${linked ? '' : `<div class="labrow"><select class="roomtype" data-roomtype="${t.id}" aria-label="معمل أو قاعة"><option${roomType(t) === 'معمل' ? ' selected' : ''}>معمل</option><option${roomType(t) === 'قاعة' ? ' selected' : ''}>قاعة</option></select><input id="lab-${t.id}" class="num" type="text" inputmode="numeric" autocomplete="off" placeholder="الرقم" aria-label="رقم المعمل أو القاعة" value="${t.lab ?? ''}" data-lab="${t.id}">
        ${t.external ? '' : `<label for="q-${t.id}">النصاب:</label><input id="q-${t.id}" class="num" type="number" min="1" max="40" inputmode="numeric" value="${t.quota ?? ''}" data-quota="${t.id}">`}</div>`}
      <div class="drop-list">${secs.length ? secs.map(s => { const c = course(s.courseId); return `<span class="chip" style="--h:${c.hue}" data-drag="section" data-id="${s.id}" title="${esc(c.name + (S.isGS ? ' — ' + SPECS[c.spec] : ''))}"><b>${esc(c.code)}</b><span class="g">${S.isGS ? esc(SHORT[c.spec]) + ' ' : ''}${groupOf(s)} · ${c.hours}س</span><span class="sws"><button class="rmt" role="switch" data-remote="${s.id}" aria-checked="${!!s.remote}" title="${s.remote ? 'هذه الشعبة عن بعد. اضغطي لإرجاعها حضورياً في المعمل' : 'فعّليه إذا كانت هذه الشعبة عن بعد'}"><i></i>${s.remote ? 'عن بعد' : 'عن بعد؟'}</button><button class="rmt" role="switch" data-blend="${s.id}" aria-checked="${!!s.blended}" title="${s.blended ? 'هذه الشعبة مدمجة. اضغطي لإلغاء الدمج' : 'فعّليه إذا كانت هذه الشعبة مدمجة'}"><i></i>مدمج</button><button class="rmt" role="switch" data-selfs="${s.id}" aria-checked="${!!s.selfStudy}" title="${s.selfStudy ? 'هذه الشعبة تدريب ذاتي. اضغطي للإلغاء' : 'فعّليه إذا كانت الشعبة تدريب ذاتي (بلا معمل أو قاعة)'}"><i></i>ذاتي</button></span><button class="x" data-unassign="${s.id}" aria-label="إلغاء الإسناد">×</button></span>`; }).join('') : '<div class="drop-empty">اسحبي مقرراً هنا</div>'}</div>
    </article>`;
}
function assignPage() {
  const visible = c => true; // الدراسات العامة courses are assigned inside each specialisation
  const mySecs = S.sections.filter(x => visible(course(x.courseId)));
  const total = mySecs.length, done = mySecs.filter(s => s.trainerId).length;
  const over = S.trainers.filter(t => t.quota && trainerLoad(t) + otherLoad(t).h > t.quota).length;
  const hrs = mySecs.filter(s => s.trainerId).reduce((a,s) => a + course(s.courseId).hours, 0);
  const linked = [...new Set(S.sections.map(x => x.trainerId).filter(Boolean))].filter(id => !S.trainers.some(t => t.id === id)).map(trainer).filter(Boolean);
  const gsSecs = S.isGS ? [] : S.sections.filter(x => isGSCourse(course(x.courseId)));
  const cards = S.trainers.map(t => trainerCard(t, false)).join('') + linked.map(t => trainerCard(t, true)).join('')
    + `<button class="tcard addcard" id="addext"><span class="plus">+</span><b>مدرب من قسم آخر</b><span class="hint">اختاري من الأسماء المحفوظة</span></button>`;
  const shown = S.courses.filter(visible);
  const filtered = shown.filter(c => S.cat === 'all' || (S.isGS ? c.spec === S.cat : c.cat === S.cat));
  const courses = filtered.map(c => {
    const secs = S.sections.filter(s => s.courseId === c.id), left = secs.filter(s => !s.trainerId).length;
    const sp = S.isGS ? `<div class="cspec">${esc(SPECS[c.spec])}</div>` : '';
    if (!secs.length) return `<div class="course empty" style="--h:${c.hue}" title="حددي عدد الشعب في الخطوة الأولى"><div class="code">${esc(c.code)}</div><div class="cname">${esc(c.name)}</div>${sp}<div class="cmeta"><span>لا توجد شعب هذا الترم</span></div></div>`;
    return `<div class="course ${left ? '' : 'done'}" style="--h:${c.hue}" data-drag="course" data-id="${c.id}">
      <div class="code">${esc(c.code)}${isGSCourse(c) && !S.isGS ? ' <span class="ctag gs">دراسات عامة</span>' : ''}</div><div class="cname" title="${esc(c.name)}">${esc(c.name)}</div>${sp}

      <div class="remain">${left ? `<b>${left}</b><span class="num">شعبة متبقية من ${secs.length}</span>` : '<span class="left">كل الشعب مُسندة ✓</span>'}</div>
    </div>`;
  }).join('');
  const segs = S.isGS ? [['all','الكل'], ...REAL().filter(k => shown.some(c => c.spec === k)).map(k => [k, SPECS[k]])]
    : CATS.filter(([k]) => k === 'all' || shown.some(c => c.cat === k));
  if (!segs.some(x => x[0] === S.cat)) S.cat = 'all';
  return `<div class="summary">

    </div>

      <div class="courses">${courses}</div>
    </section>`;
}

function viewEntities(type) {
  if (type === 'trainer') { const ids = [...new Set(S.sessions.map(s => info(s).t?.id).filter(Boolean))]; return ids.map(trainer).sort((a,b) => (S.trainers.includes(b) ? 1 : 0) - (S.trainers.includes(a) ? 1 : 0)).map(t => [t.id, 'أ. ' + t.name]); }
  if (type === 'room') return [...new Set(S.sessions.map(s => info(s).room).filter(Boolean))].sort().map(r => [r, r]);
  return [];
}
function inView(s) {
  const v = S.view, i = info(s);
  if (v.type === 'all') return true;
  if (v.type === 'trainer') return i.t?.id === v.id;
  if (v.type === 'room') return i.room === v.id;
  if (v.type === 'level') return i.group === v.id;
  return true;
}
function viewTitle() {
  const v = S.view; const e = viewEntities(v.type).find(x => x[0] === v.id);
  if (v.type === 'level') return 'جدول ' + grpTitle(v.id);
  return v.type === 'all' ? 'الجدول العام' : 'جدول ' + (e ? e[1] : '');
}

const gName = i => (S.isGS ? SHORT[i.spec] + ' ' : '') + i.group;
// type letter (ن نظري / ع عملي) and reference number of each lecture, chosen by the head of department
let forPrint = false;
const refType = s => s.rt || (s.kind === PR ? 'ع' : 'ن');
const refText = s => refType(s) + '-' + (s.ref || '');
function refHtml(s) {

  if (S.view.type === 'all') return '';

  return `<div class="bref"><select data-rt="${s.id}" aria-label="نظري أو عملي" title="ن = نظري · ع = عملي"><option${t === 'ن' ? ' selected' : ''}>ن</option><option${t === 'ع' ? ' selected' : ''}>ع</option></select><span class="dash">-</span><input data-ref="${s.id}" value="${esc(s.ref || '')}" placeholder="الرقم المرجعي" aria-label="الرقم المرجعي" inputmode="numeric"></div>`;
}
function blockHtml(s, C) {
  const i0 = info(s), v = S.view.type, i = { ...i0, group:gName(i0) };
  let l2, l3;
  if (v === 'trainer') { l2 = i.c.name; l3 = `${i.group} · ${i.place || 'بلا معمل'}`; }
  else if (v === 'room') { l2 = `${i.group} · أ. ${first(i.t.name)}`; l3 = i.c.name; }
  else if (v === 'level') { l2 = i.c.name; l3 = `${i0.gks.length > 1 ? 'مشتركة (' + i0.group.split('-')[1].split('+').join('، ') + ') · ' : ''}أ. ${i.t.name} · ${i.place}`; }
  else { l2 = `${i.group} · ${first(i.t.name)} · ${i.remote ? REMOTE : i.room ? i.room.replace('معمل ','م').replace('قاعة ','ق') : ''}`; l3 = ''; }
  const cls = ['block', i.remote ? 'remote' : '', C.bad.has(s.id) ? 'bad' : '', C.warn.has(s.id) ? 'warn' : '', s.locked ? 'locked' : '', flash.has(s.id) ? 'flash' : '', i0.gks.length > 1 ? 'shared' : ''].join(' ');
  return `<div class="${cls}" style="--h:${i.c.hue}; grid-column:${s.start + 2} / span ${s.len}; grid-row:${s._lane + 1}" data-drag="block" data-drop="block" data-id="${s.id}" title="${esc(pStart(s.start) + ' – ' + lEnd(s.start, s.len) + ' · ' + i.c.code + ' ' + i.c.name + ' — ' + i.group + ' — أ. ' + i.t.name + (i.room ? ' — ' + i.room : ''))}">
    <div class="b1">${esc(i.c.code)}<span class="badge-hours num">${s.kind ? s.kind + ' · ' : ''}${s.len}س</span><button class="lock" data-lock="${s.id}" aria-label="${s.locked ? 'إلغاء التثبيت' : 'تثبيت'}" title="${s.locked ? 'مثبّتة: لن تتغير عند إعادة الترتيب' : 'تثبيت المحاضرة'}">${s.locked ? ICON.lock : ICON.unlock}</button><button class="lock dup" data-dup="${s.sectionId}" aria-label="تكرار الشعبة في نموذج آخر" title="تكرار الشعبة في نموذج آخر">${ICON.copy}</button></div>
    <div class="b2">${esc(l2)}</div>${l3 ? `<div class="b3">${esc(l3)}</div>` : ''}${refHtml(s)}
    <span class="rz" data-resize="${s.id}" title="اسحبي لتغيير المدة"></span>
  </div>`;
}

function ghostHtml(s, lane) {
  const i = info(s);
  return `<div class="block faded" style="--h:${i.c.hue}; grid-column:${s.start + 2} / span ${s.len}; grid-row:${lane + 1}" title="${esc(pStart(s.start) + ' – ' + lEnd(s.start, s.len) + ' · ' + i.c.code + ' ' + i.c.name + ' — أ. ' + (i.t?.name || '') + ' — من جدول ' + SPECS[i.spec])}">
    <div class="b1">${esc(i.c.code)}<span class="badge-hours num">${s.kind ? s.kind + ' · ' : ''}${s.len}س</span></div><div class="b2">${esc(i.c.name)}</div><div class="b3">${S.view.type === 'trainer' ? 'من ' + esc(SPECS[i.spec]) + ' · ' + esc(groupOf(i.sec)) : 'أ. ' + esc(i.t?.name || '')}</div></div>`;
}
function gridHtml(C, filter = inView, gkey = '', ghosts = []) {
  const tp = tpl(), n = tp.n;
  const list = S.sessions.filter(s => s.day != null && filter(s));
  let head = `<div class="tt-head"><div></div>${Array.from({length:n}, (_,i) => `<div><b>${pStart(i)}</b>${pEnd(i)}</div>`).join('')}</div>`;
  const rows = DAYS.map((d, di) => {
    const items = list.filter(s => s.day === di).map(s => ({ s })).concat(ghosts.filter(s => s.day === di).map(s => ({ s, ghost:true })))
      .sort((a,b) => a.s.start - b.s.start || b.s.len - a.s.len);
    const lanes = [];
    items.forEach(o => { let l = lanes.findIndex(end => end <= o.s.start); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = o.s.start + o.s.len; o.lane = l; if (!o.ghost) o.s._lane = l; });
    const L = Math.max(1, lanes.length);
    const cells = Array.from({length:n}, (_,k) => `<div class="cell ${k % 2 === 0 && k ? 'edge' : ''}" style="grid-column:${k + 2}" data-drop="cell" data-g="${gkey}" data-day="${di}" data-slot="${k}"></div>`).join('');
    return `<div class="tt-row" style="grid-template-rows:repeat(${L}, var(--lane-h))"><div class="dayname">${d}</div>${cells}${items.map(o => o.ghost ? ghostHtml(o.s, o.lane) : blockHtml(o.s, C)).join('')}</div>`;
  }).join('');
  return `<div class="tt ${S.view.type === 'all' ? 'compact' : ''}" style="--n:${n}" data-grid="${gkey}">${head}${rows}</div>`;
}

function heatHtml(m) {
  const n = tpl().n, grid = Array.from({length:5}, () => Array(n).fill(0));
  return '';
}
function optHeat(o) {
  const n = tpl().n, g = Array.from({length:5}, () => Array(n).fill(0)); let mx = 1;
  o.sol.forEach(s => { if (s.day == null) return; for (let k = s.start; k < s.start + s.len && k < n; k++) { g[s.day][k]++; mx = Math.max(mx, g[s.day][k]); } });
  return `<div class="heat" style="grid-template-columns:repeat(${n},1fr)" aria-hidden="true">${g.map(r => r.map(v => `<i style="background:${v ? `color-mix(in srgb, var(--accent) ${Math.round(25 + 75 * v / mx)}%, var(--surface-2))` : 'var(--surface-2)'}"></i>`).join('')).join('')}</div>`;
}

function setCount(cid, target) {

function setCountCore(cid, target) {
  const c = course(cid); target = Math.max(0, Math.min(MAXSEC, target));
  let secs = S.sections.filter(s => s.courseId === cid);
  if (target > secs.length) {
    const used = new Set(secs.map(s => s.n));
    for (let k = 1; secs.length < target; k++) if (!used.has(k)) { const sec = { id:cid + 's' + k, courseId:cid, n:k, trainerId:null }; S.sections.push(sec); secs.push(sec); used.add(k); }
    if (target === MAXSEC) toast(`الحد الأعلى ${MAXSEC} شعبة للمقرر في هذا النموذج`);
  } else {
    let blocked = false;
    while (secs.length > target) {
      const free = secs.filter(s => !s.trainerId).sort((a,b) => b.n - a.n)[0];
      if (!free) { blocked = true; break; }
      S.sections = S.sections.filter(s => s !== free); secs = secs.filter(s => s !== free);

  }

}

function levelBook(X, keys, wb, used, only = null) {

async function pdfPages(pages, filename) {
  toast('جارٍ تجهيز ملف PDF…');
  try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'); await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'); }
  catch (e) { return toast('تعذّر تحميل مكتبة PDF. تحققي من الاتصال'); }
  const { jsPDF } = window.jspdf; const pdf = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
  const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
  try {
    for (let i = 0; i < pages.length; i++) {
      const { title, node, sub } = pages[i];
      const box = document.createElement('div');
      box.className = 'force-light'; box.dir = 'rtl';
      box.style.cssText = 'position:fixed; left:-10000px; top:0; width:1240px; padding:28px; background:#fff; color:var(--ink); font-family:var(--font-body)';
      box.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px"><div style="display:flex; align-items:center; gap:16px"><img src="${LOGO}" alt="" style="height:58px; width:auto"><div><h2 style="font-family:var(--font-display); font-size:22px; margin:0">${esc(title)}</h2>${sub ? `<div style="font-size:15px; color:var(--accent); margin-top:4px; font-weight:600">${esc(sub)}</div>` : ''}</div></div><span style="color:var(--muted)">التخصص: ${SPECS[ROOT.current]}</span></div>`;
      node.style.minWidth = '0';
      node.querySelectorAll('.rz, .lock, .lane-btns').forEach(el => el.remove());
      const wrap = document.createElement('div'); wrap.className = 'tt-wrap'; wrap.style.overflow = 'visible'; wrap.appendChild(node); box.appendChild(wrap);
      document.body.appendChild(box);
      try {
        const canvas = await window.html2canvas(box, { scale:2, backgroundColor:null });
        if (i) pdf.addPage();
        const ratio = Math.min((W - 40) / canvas.width, (H - 40) / canvas.height);
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', (W - canvas.width * ratio) / 2, 20, canvas.width * ratio, canvas.height * ratio);
      } finally { box.remove(); }
    }
    await offerFile(filename, pdf.output('blob'));
  } catch (e) { toast('تعذّر إنشاء ملف PDF'); }
}
const pdfFrom = (title, node, filename) => pdfPages([{ title, node }], filename);
